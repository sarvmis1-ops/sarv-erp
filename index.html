// ---------- 7. Seed generator ----------
function genValue(f, i, e) {
  switch (f.type) {
    case 'auto': return fmtNo(e, i + 1);
    case 'date': { const [a, b] = f.range || [0, 40]; return addDays(-ri(a, b)); }
    case 'fdate': { const [a, b] = f.range || [-8, 25]; return addDays(ri(a, b)); }
    case 'time': return `${pad(ri(6, 22), 2)}:${pick(['00', '15', '30', '45'])}`;
    case 'num': { if (f.calc) return 0; const [a, b] = f.range || [1, 100]; return ri(a, b); }
    case 'money': { if (f.calc) return 0; const [a, b] = f.range || [5000, 500000]; return b <= 5000 ? ri(a, b) : Math.round(ri(a, b) / 10) * 10; }
    case 'pct': { if (f.calc) return 0; const [a, b] = f.range || [55, 99]; return ri(a, b); }
    case 'user': return pick(USERS);
    case 'ref': return pick(REF_POOLS[f.ref] || ['—']);
    case 'sel': return pick(f.options);
    case 'status': return pick(f.options);
    case 'area': return '';
    default:
      if (f.pool && POOLS[f.pool]) return pick(POOLS[f.pool]);
      if (GEN[f.key]) return GEN[f.key](i);
      if (f.key.endsWith('_ref') || REF_PREFIX[f.key]) return `${REF_PREFIX[f.key] || 'DOC'}/${FY}/${pad(ri(1, 24))}`;
      return `${f.label} ${i + 1}`;
  }
}
const materialRate = n => (MATERIALS.find(m => m[0] === n) || [])[3] || 100;
function genLines(src) {
  const pool = src === 'products' ? PRODUCTS : MATERIALS; const k = ri(1, 4); const used = new Set(); const out = [];
  for (let j = 0; j < k; j++) {
    const it = pick(pool); if (used.has(it[0])) continue; used.add(it[0]);
    const rate = src === 'products' ? it[6] : it[3];
    out.push({ id: uid(), item: it[0], uom: src === 'products' ? 'pcs' : it[2], qty: src === 'products' ? ri(2, 60) * 10 : (it[2] === 'pcs' ? ri(5, 200) * 10 : ri(20, 900)), rate, disc: pick([0, 0, 2, 5]), tax: src === 'products' ? (rate > 1000 ? 12 : 5) : (it[1] === 'Yarn' ? 12 : 18) });
  }
  return out;
}
function calcTotals(lines = [], ch = {}) {
  let untaxed = 0, tax = 0;
  (lines || []).forEach(l => { const a = (Number(l.qty) || 0) * (Number(l.rate) || 0) * (1 - (Number(l.disc) || 0) / 100); untaxed += a; tax += a * (Number(l.tax) || 0) / 100; });
  const other = (Number(ch && ch.freight) || 0) + (Number(ch && ch.packing) || 0) + (Number(ch && ch.insurance) || 0);
  const before = untaxed + tax + other; const grand = Math.round(before);
  return { untaxed, tax, other, before, round: grand - before, grand };
}
function bomFor(product, qty) {
  const p = PRODUCTS.find(x => x[0] === product); const w = p ? p[4] : 4; const q = Number(qty) || 0; const kg = w * q;

const LS_KEY = 'sarv_erp_ui_v1';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } };

function loadDB() { try { const s = lsGet(LS_KEY); if (!s) return null; const d = JSON.parse(s); if (d && d.v === 1 && d.data) { Object.keys(ENTITIES).forEach(k => { if (!d.data[k]) d.data[k] = []; if (!d.seq[k]) d.seq[k] = d.data[k].length + 1; }); if (!d.data.jobTimers) d.data.jobTimers = []; if (!d.settings) d.settings = { prefix: {} }; if (!d.events) d.events = []; return d; } } catch (e) { } return null; }

/* 🔌 DATA LAYER — every screen calls ONLY these functions.
   Phase-2 me har function ke andar Supabase call aayegi (sb.from(table).select/insert/update/delete),
   UI code ko touch nahi karna padega. */
function StoreProvider({ children }) {
  const [db, setDb] = useState(() => loadDB() || seedDB());
  const ref = useRef(db); ref.current = db;
  useEffect(() => { const t = setTimeout(() => lsSet(LS_KEY, JSON.stringify(db)), 400); return () => clearTimeout(t); }, [db]);
  const api = useMemo(() => {
    const commit = next => { ref.current = next; setDb(next); };
    const save = (k, row, by, action) => {
      const cur = ref.current; const e = ENTITIES[k]; const list = cur.data[k] || []; const now = new Date().toISOString();
      let r = { ...row }; let seq = cur.seq; const isNew = !r.id;
      if (isNew) { r.id = uid(); r.created_at = now; const ak = e && autoKey(e); if (ak && !r[ak]) { const n = seq[k] || 1; r[ak] = fmtNo(e, n, cur.settings); seq = { ...seq, [k]: n + 1 }; } }
      r.updated_at = now; if (e && e.compute) Object.assign(r, e.compute(r));
      const prev = list.find(x => x.id === r.id);
      const data = { ...cur.data, [k]: isNew ? [r, ...list] : list.map(x => x.id === r.id ? r : x) };
      const ev = { id: uid(), entity: k, docId: r.id, no: e ? docNo(e, r) : '', at: now, by: by || 'system', action: action || (isNew ? 'Created' : 'Updated'), from: prev ? prev.status : null, to: r.status };
      commit({ ...cur, data, seq, events: [ev, ...cur.events].slice(0, 3000) });
      return r;
    };
    const remove = (k, ids, by) => { const cur = ref.current; const set = new Set(ids); const now = new Date().toISOString(); const evs = ids.map(id => ({ id: uid(), entity: k, docId: id, at: now, by: by || 'system', action: 'Deleted' })); commit({ ...cur, data: { ...cur.data, [k]: (cur.data[k] || []).filter(r => !set.has(r.id)) }, events: [...evs, ...cur.events].slice(0, 3000) }); };
    const patch = (k, id, p, by, action) => { const r = (ref.current.data[k] || []).find(x => x.id === id); return r ? save(k, { ...r, ...p }, by, action) : null; };
    const setCollection = (k, fn) => { const cur = ref.current; commit({ ...cur, data: { ...cur.data, [k]: fn(cur.data[k] || []) } }); };
    const setSettings = fn => { const cur = ref.current; const s = fn(cur.settings || { prefix: {} }, cur.seq); commit({ ...cur, settings: s.settings, seq: s.seq }); };
    const reset = () => { lsDel(LS_KEY); commit(seedDB()); };
    return {
      db, rows: k => db.data[k] || [], get: (k, id) => (db.data[k] || []).find(r => r.id === id),
      findByNo: no => { if (!no) return null; for (const e of Object.values(ENTITIES)) { const ak = autoKey(e); const r = ak && (db.data[e.key] || []).find(x => x[ak] === no); if (r) return { ent: e, row: r }; } return null; },
      save, remove, patch, setCollection, setSettings, reset
    };
  }, [db]);
  return <StoreCtx.Provider value={api}>{children}</StoreCtx.Provider>;
}

function downloadCSV(name, cols, rows) {

// ---------- 12. AI Insights (natural-language → filter) ----------
function parseAI(text, e) {
  let t = ' ' + String(text || '').toLowerCase() + ' '; const preds = []; const chips = [];
  if (/overdue|late|delayed/.test(t)) { preds.push(r => isOverdue(r, e)); chips.push('Overdue'); t = t.replace(/overdue|late|delayed/g, ' '); }
  const st = [...e.statuses].sort((a, b) => b.length - a.length).filter(s => { const hit = t.includes(s.toLowerCase()); if (hit) t = t.split(s.toLowerCase()).join(' '); return hit; });
  if (st.length) { preds.push(r => st.includes(r.status)); chips.push('Status: ' + st.join(' / ')); }
  const dk = dateKeyOf(e);
  if (/\btoday\b/.test(t)) { const d = todayISO(); preds.push(r => String(r[dk] || '').slice(0, 10) === d); chips.push('Today'); t = t.replace(/\btoday\b/, ' '); }
  const m = t.match(/last\s+(\d+)\s+days?/); if (m) { const from = addDays(-Number(m[1])); preds.push(r => String(r[dk] || '') >= from); chips.push(`Last ${m[1]} days`); t = t.replace(m[0], ' '); }
  if (/this month/.test(t)) { const p = todayISO().slice(0, 7); preds.push(r => String(r[dk] || '').startsWith(p)); chips.push('This month'); t = t.replace('this month', ' '); }
  e.fields.filter(f => f.type === 'sel').forEach(f => { f.options.forEach(o => { const ol = ' ' + o.toLowerCase() + ' '; if (o.length > 2 && t.includes(ol)) { preds.push(r => r[f.key] === o); chips.push(`${f.label}: ${o}`); t = t.replace(ol, ' '); } }); });
  const re = /([a-z_ ]+?)\s*(>=|<=|>|<|=)\s*([\d,.]+)\s*(k|lakh|l|cr)?\b/g; let mm; const numF = e.fields.filter(f => ['num', 'money', 'pct'].includes(f.type));
  while ((mm = re.exec(t))) {
    const w = mm[1].trim().split(/\s+/).pop() || ''; const f = (w && numF.find(f => f.key.includes(w) || f.label.toLowerCase().includes(w))) || (/(amount|value|total|rs)/.test(w) ? numF.find(f => f.type === 'money') : null);
    if (f) { const mult = { k: 1e3, l: 1e5, lakh: 1e5, cr: 1e7 }[mm[4]] || 1; const v = Number(mm[3].replace(/,/g, '')) * mult; const op = mm[2]; preds.push(r => { const x = Number(r[f.key]) || 0; return op === '>' ? x > v : op === '<' ? x < v : op === '>=' ? x >= v : op === '<=' ? x <= v : x === v; }); chips.push(`${f.label} ${op} ${num(v)}`); }
  }
  t = t.replace(re, ' ');
  const rest = t.replace(/\b(show|me|all|the|with|where|and|of|for|list|records|orders|order|which|are|is|in|from|by|whose|having|give|find|status)\b/g, ' ').replace(/\s+/g, ' ').trim();
  if (rest.length >= 3) { preds.push(r => Object.values(r).some(v => typeof v === 'string' && v.toLowerCase().includes(rest))); chips.push(`Contains “${rest}”`); }
  return { pred: r => preds.every(p => p(r)), chips };
}

function ComparePage() {
  const store = useStore(); const ui = useUI(); const { user } = useAuth();
  const sqs = store.rows('supplierQuotations'); const rfqs = [...new Set(sqs.map(s => s.rfq_ref).filter(Boolean))].sort();
  const [rfq, setRfq] = useState(rfqs[0] || '');
  const quotes = sqs.filter(s => s.rfq_ref === rfq);
  const items = [...new Set(quotes.flatMap(q => (q.lines || []).map(l => l.item)))];
  const rate = (q, it) => { const l = (q.lines || []).find(x => x.item === it); return l ? Number(l.rate) : null; };
  const qtyOf = it => { for (const q of quotes) { const l = (q.lines || []).find(x => x.item === it); if (l) return Number(l.qty) || 0; } return 0; };
  const best = it => { let b = null; quotes.forEach(q => { const r = rate(q, it); if (r !== null && (b === null || r < b.r)) b = { r, q }; }); return b; };
  const totals = quotes.map(q => items.reduce((s, it) => s + (rate(q, it) || 0) * qtyOf(it), 0));
  const pos = totals.filter(t => t > 0); const minT = pos.length ? Math.min(...pos) : 0; const mixTotal = items.reduce((s, it) => { const b = best(it); return s + (b ? b.r * qtyOf(it) : 0); }, 0);
  const createPOs = async () => {
    const bySup = {}; items.forEach(it => { const b = best(it); if (!b) return; const src = (b.q.lines || []).find(x => x.item === it); (bySup[b.q.supplier] = bySup[b.q.supplier] || []).push({ ...src, id: uid() }); });
    const ok = await ui.confirm({ title: 'Create POs (L1 per item)', message: `Mix-and-match: ${Object.keys(bySup).length} PO(s) will be created —\n${Object.entries(bySup).map(([s, l]) => `• ${s}: ${l.length} item(s)`).join('\n')}`, okText: 'Create POs' }); if (!ok) return;
    Object.entries(bySup).forEach(([s, lines]) => { const q = quotes.find(x => x.supplier === s) || {}; store.save('purchaseOrders', { supplier: s, date: todayISO(), expected_date: addDays(10), buyer: user.name, payment_terms: '30 Days', warehouse: 'RM Store', pr_ref: '', lines, charges: { freight: 0, packing: 0, insurance: 0 }, total: calcTotals(lines).grand, status: 'Draft', attachments: [], source: { entity: 'supplierQuotations', id: q.id, no: q.no || rfq } }, user.name, `Created from comparison ${rfq}`); });
    ui.toast(`${Object.keys(bySup).length} Purchase Order(s) created as Draft`); ui.navigate('/purchase/purchase-orders');
  };
  return (<Card title="Quotation Comparison" icon="Scale" right={<div className="flex gap-2"><select value={rfq} onChange={ev => setRfq(ev.target.value)} className="border rounded-md px-2 py-1 text-sm">{rfqs.map(r => <option key={r}>{r}</option>)}</select><Btn tone="success" icon="ShoppingCart" disabled={!quotes.length} onClick={createPOs}>Create PO (L1 per item)</Btn></div>}>
    {!quotes.length ? <Empty title="No supplier quotations for this RFQ" /> : <>
      <div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="bg-slate-50 text-xs text-slate-600"><th className="px-3 py-2 text-left">Item</th><th className="px-3 py-2 text-right">Qty</th>{quotes.map(q => <th key={q.id} className="px-3 py-2 text-right min-w-[150px]"><div className="font-semibold text-slate-800">{q.supplier}</div><div className="font-normal">{q.no} · {q.delivery_days}d delivery</div></th>)}</tr></thead>
        <tbody className="divide-y">{items.map(it => { const b = best(it); return <tr key={it}><td className="px-3 py-2">{it}</td><td className="px-3 py-2 text-right tabular-nums">{num(qtyOf(it))}</td>{quotes.map(q => { const r = rate(q, it); const isB = b && b.q.id === q.id; return <td key={q.id} className={cls('px-3 py-2 text-right tabular-nums', isB && 'bg-emerald-50 text-emerald-700 font-bold')}>{r === null ? <span className="text-slate-300">—</span> : <>{inr(r)}{isB && <span className="ml-1 text-[10px]">L1</span>}<div className="text-[10px] text-slate-400 font-normal">{inr(r * qtyOf(it))}</div></>}</td>; })}</tr>; })}
          <tr className="bg-slate-50 font-bold"><td className="px-3 py-2" colSpan={2}>Total (untaxed)</td>{totals.map((t, i) => <td key={i} className={cls('px-3 py-2 text-right tabular-nums', t === minT && 'text-emerald-700')}>{inr(t)}{t === minT && ' 🏆'}</td>)}</tr></tbody></table></div>
      <div className="mt-3 grid md:grid-cols-3 gap-3 text-sm"><div className="rounded-lg bg-emerald-50 border border-emerald-200 p-3">🏆 Best single vendor: <b>{inr(minT)}</b></div><div className="rounded-lg bg-blue-50 border border-blue-200 p-3">🧩 Mix-and-match (L1 per item): <b>{inr(mixTotal)}</b></div><div className="rounded-lg bg-amber-50 border border-amber-200 p-3">💰 Extra saving by splitting: <b>{inr(Math.max(0, minT - mixTotal))}</b></div></div>
    </>}
  </Card>);
}

function aggregate(rows, agg) { if (agg === 'count') return rows.length; const f = agg.split(':')[1]; return rows.reduce((s, r) => s + (Number(r[f]) || 0), 0); }
function tileFor(store, spec, idx, navigate) {
  const [title, ek, agg, pred] = spec; const e = ENTITIES[ek]; const all = store.rows(ek); const p = pred === 'overdue' ? (r => isOverdue(r, e)) : pred || (() => true); const rows = all.filter(p);
  const dk = dateKeyOf(e); const day = r => String(r[dk] || '').slice(0, 10);

  const breakdown = store.rows('machines').filter(m => m.status === 'Breakdown');
  const lowMat = store.rows('materials').filter(m => Number(m.stock) < Number(m.min_stock));
  const myActs = store.rows('activities').filter(a => a.assigned === user.name && a.status === 'Planned');
  const count = alerts.length + breakdown.length + lowMat.length;
  const go = p => { setPop(null); ui.navigate(p); };
  return (<header className="no-print h-16 bg-white shadow-sm flex items-center gap-2 px-3 md:px-4 sticky top-0 z-20">
    <button type="button" onClick={onMenu} className="md:hidden p-2 rounded hover:bg-slate-100"><Icon name="Menu" /></button>
    <button type="button" onClick={onCollapse} className="hidden md:block p-2 rounded hover:bg-slate-100"><Icon name="Menu" /></button>
    <div className="flex items-center gap-2 bg-slate-100 rounded-full pl-3 pr-2 py-1 min-w-0"><Icon name="Building2" size={14} className="text-slate-500" /><select value={unit} onChange={ev => { setUnit(ev.target.value); ui.toast('Unit switched — per-unit data filter Supabase link ke baad lagega', 'warn'); }} className="bg-transparent text-sm outline-none max-w-[150px] sm:max-w-none truncate">{UNITS.map(u => <option key={u}>{u}</option>)}</select></div>
    <div className="flex-1" />
    <div className="relative"><button type="button" onClick={() => setPop(pop === 'acts' ? null : 'acts')} className="p-2 rounded-full hover:bg-slate-100 relative" title="My activities"><Icon name="ListChecks" size={19} />{myActs.length > 0 && <span className="absolute top-1 right-1 w-2 h-2 bg-blue-600 rounded-full" />}</button>
      {pop === 'acts' && <Dropdown right onClose={() => setPop(null)}><div className="px-3 py-1 text-[11px] uppercase text-slate-400 font-semibold">My planned activities ({myActs.length})</div>{myActs.slice(0, 8).map(a => <DItem key={a.id} icon="CircleDot" onClick={() => go(routeFor('activities', a.id))}>{a.subject} · {fmtDate(a.date)}</DItem>)}<DItem icon="ArrowRight" onClick={() => go('/activities/my')}>Open My Activities</DItem></Dropdown>}</div>
    <div className="relative"><button type="button" onClick={() => setPop(pop === 'recent' ? null : 'recent')} className="p-2 rounded-full hover:bg-slate-100" title="Recently viewed"><Icon name="History" size={19} /></button>
      {pop === 'recent' && <Dropdown right onClose={() => setPop(null)}><div className="px-3 py-1 text-[11px] uppercase text-slate-400 font-semibold">Recently viewed</div>{recent.map(r => <DItem key={r.path} icon="Clock" onClick={() => go(r.path)}>{r.label}</DItem>)}{!recent.length && <div className="px-3 py-2 text-xs text-slate-400">Nothing yet</div>}</Dropdown>}</div>
    <div className="relative"><button type="button" onClick={() => setPop(pop === 'bell' ? null : 'bell')} className="p-2 rounded-full hover:bg-slate-100 relative" title="Notifications"><Icon name="Bell" size={19} />{count > 0 && <span className="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 bg-red-600 text-white text-[10px] rounded-full flex items-center justify-center">{count > 99 ? '99+' : count}</span>}</button>
      {pop === 'bell' && <Dropdown right onClose={() => setPop(null)}><div className="w-80">
        {breakdown.map(m => <DItem key={m.id} icon="AlertOctagon" danger onClick={() => go(routeFor('machines', m.id))}>{m.code} breakdown</DItem>)}
        {lowMat.slice(0, 5).map(m => <DItem key={m.id} icon="PackageX" onClick={() => go('/warehouse/stock')}>Low stock: {m.name}</DItem>)}
        {alerts.slice(0, 12).map(({ e, r }) => <DItem key={r.id} icon="Clock" onClick={() => go(routeFor(e.key, r.id))}>Overdue {e.title}: {docNo(e, r)}</DItem>)}
        {!count && <div className="px-3 py-3 text-xs text-slate-400">All clear 🎉</div>}</div></Dropdown>}</div>
    <div className="relative"><button type="button" onClick={() => setPop(pop === 'user' ? null : 'user')} className="flex items-center gap-2 pl-2 pr-1 py-1 rounded-full hover:bg-slate-100"><span className="hidden sm:block text-sm font-medium">{user.name}</span><span className="w-8 h-8 rounded-full bg-gradient-to-br from-blue-600 to-indigo-600 text-white flex items-center justify-center text-sm font-bold">{user.name.slice(0, 1).toUpperCase()}</span></button>
      {pop === 'user' && <Dropdown right onClose={() => setPop(null)}><div className="px-3 py-2 border-b"><div className="font-semibold text-sm">{user.name}</div><div className="text-xs text-slate-500">{user.role}</div></div><DItem icon="Settings" onClick={() => go('/admin/settings')}>Document sequences</DItem><DItem icon="LogOut" danger onClick={logout}>Logout</DItem></Dropdown>}</div>
  </header>);
}
function parseHash() { const h = (window.location.hash || '#/home').replace(/^#\/?/, ''); const parts = h.split('/').map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } }); return { mod: parts[0] || 'home', item: parts[1] || '', id: parts[2] || '' }; }
function Shell() {
  const ui = useUI();
  const [route, setRoute] = useState(parseHash());
  const [collapsed, setCollapsed] = useState(false); const [mobileOpen, setMobileOpen] = useState(false);
  const [unit, setUnit] = useState(UNITS[1]); const [recent, setRecent] = useState([]);
  useEffect(() => { const f = () => { setRoute(parseHash()); setMobileOpen(false); try { window.scrollTo(0, 0); } catch (e) { } }; window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f); }, []);
  const mod = MODULE_MAP[route.mod] || MODULE_MAP.home;
  const item = mod.items.find(i => i.key === route.item) || null;
  const itemKey = item ? item.key : '';
  useEffect(() => { if (item) { const path = `/${mod.key}/${item.key}`; setRecent(r => [{ path, label: `${mod.label} › ${item.label}` }, ...r.filter(x => x.path !== path)].slice(0, 8)); } }, [mod.key, itemKey]); // eslint-disable-line
  let page; const title = mod.key === 'home' ? 'Dashboard' : item ? item.label : mod.label;
  if (mod.key === 'home') page = <HomeDashboard />;
  else if (!item) page = <ModuleIndex mod={mod} />;
  else if (item.entity && (route.id || item.page === 'new')) page = <FormPage key={`${mod.key}-${item.key}-${route.id || 'new'}`} mod={mod} item={item} id={route.id || 'new'} />;
  else switch (item.page) {
    case 'dash': page = <ModuleDashboard key={mod.key + item.key} mod={mod} item={item} />; break;
    case 'list': page = <ListPage key={mod.key + item.key} mod={mod} item={item} />; break;
    case 'kanban': page = <KanbanPage key={mod.key + item.key} mod={mod} item={item} />; break;
    case 'timer': page = <TimerPage />; break;
    case 'bulk': page = <BulkEntryPage />; break;
    case 'punch': page = <PunchPage />; break;
    case 'ppc': page = <PPCPage />; break;
    case 'compare': page = <ComparePage />; break;
    case 'pareto': page = <ParetoPage />; break;
    case 'map': page = <MapPage />; break;
    case 'stock': page = <StockPage />; break;
    case 'moByProduct': page = <MOByProductPage />; break;
    case 'reports': page = <ReportsPage key={mod.key} mod={mod} />; break;
    case 'config': page = <ConfigPage key={mod.key} mod={mod} />; break;
    default: page = <ModuleIndex mod={mod} />;
  }
  return (<div className="min-h-screen flex bg-slate-100">
    <Sidebar route={route} collapsed={collapsed} mobileOpen={mobileOpen} onClose={() => setMobileOpen(false)} onExpand={() => setCollapsed(false)} />
    <div className="flex-1 min-w-0 flex flex-col">
      <Topbar onMenu={() => setMobileOpen(true)} onCollapse={() => setCollapsed(c => !c)} unit={unit} setUnit={setUnit} recent={recent} />
      <main className="flex-1 p-3 md:p-5">
        <div className="text-xs text-slate-500 mb-1 no-print flex flex-wrap items-center gap-1"><button type="button" onClick={() => ui.navigate('/home')} className="hover:text-blue-700">Home</button>{mod.key !== 'home' && <><span>/</span><button type="button" onClick={() => ui.navigate('/' + mod.key)} className="hover:text-blue-700">{mod.label}</button></>}{item && <><span>/</span><button type="button" onClick={() => ui.navigate(`/${mod.key}/${item.key}`)} className="hover:text-blue-700">{item.label}</button></>}{route.id && <><span>/</span><span>{route.id === 'new' ? 'New' : 'Edit'}</span></>}</div>
        <div className="bg-slate-200/70 rounded-lg px-4 py-2 mb-4 flex items-center gap-2 no-print"><Icon name={mod.icon} size={18} className="text-blue-700" /><h1 className="font-semibold text-slate-800">{title}</h1>{item && item.entity && item.filter && <span className="text-[11px] px-2 py-0.5 rounded-full bg-white text-slate-500">filtered view</span>}</div>
        {page}
      </main>
      <footer className="no-print text-center text-xs text-slate-400 py-3">© {new Date().getFullYear()}. Product of Sarv India Home Furnishing · MIS Dept.</footer>
    </div>
  </div>);
}
function Login({ onLogin }) {
  const [u, setU] = useState('Satinder'); const [p, setP] = useState(''); const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const submit = ev => { ev.preventDefault(); if (!u.trim() || !p) { setErr('Username & password required'); return; } setBusy(true); setTimeout(() => onLogin({ name: u.trim(), role: 'Admin' }), 300); };
  return (<div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-800 via-blue-700 to-indigo-800 p-4">
    <form onSubmit={submit} className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-7">
      <div className="flex items-center gap-3 mb-6"><div className="w-11 h-11 rounded-xl bg-blue-700 text-white flex items-center justify-center font-black text-lg">S</div><div><div className="font-bold text-lg text-slate-800">SARV ERP</div><div className="text-xs text-slate-500">Mink Blanket Manufacturing Suite</div></div></div>
      <label className="block text-xs font-medium text-slate-600">Username<input value={u} onChange={ev => setU(ev.target.value)} className={cls(inputCls(), 'mt-1')} /></label>
      <label className="block text-xs font-medium text-slate-600 mt-3">Password<input type="password" value={p} onChange={ev => setP(ev.target.value)} className={cls(inputCls(), 'mt-1')} placeholder="any password (demo)" /></label>
      {err && <div className="text-xs text-red-600 mt-2">{err}</div>}
      <button type="submit" disabled={busy} className="w-full mt-5 bg-blue-600 hover:bg-blue-700 text-white rounded-md py-2 font-semibold disabled:opacity-60">{busy ? 'Signing in…' : 'Sign in'}</button>
      <div className="text-[11px] text-slate-400 mt-4 text-center">Demo mode — Supabase Auth Phase-2 me connect hoga</div>
    </form>
  </div>);
}
function App() {
  const [user, setUser] = useState(() => { try { return JSON.parse(lsGet('sarv_erp_user') || 'null'); } catch (e) { return null; } });
  const login = u => { lsSet('sarv_erp_user', JSON.stringify(u)); setUser(u); if (!window.location.hash) window.location.hash = '/home'; };
  const logout = () => { lsDel('sarv_erp_user'); setUser(null); };
  if (!user) return <Login onLogin={login} />;
  return (<AuthCtx.Provider value={{ user, logout }}><StoreProvider><UIProvider><Shell /></UIProvider></StoreProvider></AuthCtx.Provider>);
}

// Error boundary so one broken screen never blanks the whole ERP
class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error('[SarvERP]', err, info); }
  render() { if (this.state.err) return (<div className="min-h-screen flex items-center justify-center p-6"><div className="bg-white rounded-xl shadow p-6 max-w-lg"><div className="font-bold text-red-600 mb-2">⚠️ Screen error</div><pre className="text-xs bg-slate-50 p-3 rounded overflow-auto">{String(this.state.err && this.state.err.message)}</pre><div className="flex gap-2 mt-4"><button type="button" className="px-3 py-1.5 bg-blue-600 text-white rounded" onClick={() => { this.setState({ err: null }); window.location.hash = '/home'; }}>Go to Dashboard</button><button type="button" className="px-3 py-1.5 border rounded" onClick={() => { lsDel(LS_KEY); window.location.reload(); }}>Reset data & reload</button></div></div></div>); return this.props.children; }
}

// ---------- 21. Client Tree Hydration ----------
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Boundary><App /></Boundary>);
</script>
</body>
</html>
